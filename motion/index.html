<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zhenzhen Liu – Orbit</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:system-ui,sans-serif}
  canvas{position:absolute;left:50%;top:50%;transform-origin:center}
  #hint{position:fixed;left:16px;bottom:30px;font:500 13px system-ui;color:#778191;transition:opacity .3s;z-index:2}
  #credits{position:fixed;left:16px;right:16px;bottom:10px;font:500 12px system-ui;color:#778191;z-index:2;transition:opacity .3s}
  #credits a{color:#73deff}
  body.clean #hint,body.clean #credits{opacity:0}
</style>
<script type="importmap">{"imports":{"three":"./assets/vendor/three.module.js","three/addons/":"./assets/vendor/jsm/"}}</script>
</head>
<body>
<div id="hint">move the mouse to look around · H = hide this hint (for recording)</div>
<div id="credits">Planet textures: <a href="https://www.solarsystemscope.com/textures/">Solar System Scope</a> (CC BY 4.0) · Saturn V &amp; ISS models: NASA (no endorsement implied) · Spaceman: Propel Ventures</div>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {DRACOLoader} from 'three/addons/loaders/DRACOLoader.js';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {ShaderPass} from 'three/addons/postprocessing/ShaderPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';

const W=1080,H=1350,P=24,TAU=Math.PI*2,A='assets/space/';
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(1);renderer.setSize(W,H,false);
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
document.body.appendChild(renderer.domElement);
const cvs=renderer.domElement;cvs.style.width=W+'px';cvs.style.height=H+'px';
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);cvs.style.transform=`translate(-50%,-50%) scale(${s})`}
addEventListener('resize',fit);fit();

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(40,W/H,.1,3000);

/* seeded random so every recorded frame is reproducible */
let seed=4242;
const rnd=()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const lerp=(a,b,u)=>a+(b-a)*u, smooth=u=>u*u*(3-2*u);
const win=(t,a,b)=>{const u=(t-a)/(b-a);return u>=0&&u<=1?u:-1};

const texLoader=new THREE.TextureLoader();
const tex=async(f,srgb=true)=>{const t=await texLoader.loadAsync(A+f);if(srgb)t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;return t};
const draco=new DRACOLoader().setDecoderPath('assets/vendor/draco/');
const glb=f=>new GLTFLoader().setDRACOLoader(draco).loadAsync(A+f);
const img=src=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=src});

/* soft radial sprite texture (sun glow, flares) */
function glowTex(stops){const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d');
  const g=x.createRadialGradient(128,128,0,128,128,128);stops.forEach(([o,col])=>g.addColorStop(o,col));x.fillStyle=g;x.fillRect(0,0,256,256);
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t}

/* chroma-key the Propel spaceman off its flat navy background */
function keyed(im){const c=document.createElement('canvas');c.width=im.width;c.height=im.height;const x=c.getContext('2d');x.drawImage(im,0,0);
  const d=x.getImageData(0,0,c.width,c.height),p=d.data,br=p[32],bg=p[33],bb=p[34];
  for(let i=0;i<p.length;i+=4){const e=Math.abs(p[i]-br)+Math.abs(p[i+1]-bg)+Math.abs(p[i+2]-bb);p[i+3]=e<36?0:e<70?Math.round((e-36)/34*255):255}
  x.putImageData(d,0,0);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t}

const sunDir=new THREE.Vector3(-.75,.45,.42).normalize();   // sun upper-left, slightly in front: lit faces toward camera
const objs={};

async function build(){
  const [milky,day,night,clouds,moonT,marsT,satT,ringT,iss,s5,sm1,sm3]=await Promise.all([
    tex('2k_stars_milky_way.jpg'),tex('2k_earth_daymap.jpg'),tex('2k_earth_nightmap.jpg'),tex('2k_earth_clouds.jpg',false),
    tex('2k_moon.jpg'),tex('2k_mars.jpg'),tex('2k_saturn.jpg'),tex('2k_saturn_ring_alpha.png'),
    glb('iss.glb'),glb('saturn-v.glb'),img('assets/spaceman-01.png'),img('assets/spaceman-03.png')]);

  /* sky + reflections */
  milky.mapping=THREE.EquirectangularReflectionMapping;
  const pm=new THREE.PMREMGenerator(renderer);scene.environment=pm.fromEquirectangular(milky).texture;
  const sky=new THREE.Mesh(new THREE.SphereGeometry(1500,64,32),new THREE.MeshBasicMaterial({map:milky,side:THREE.BackSide,color:0x56607a}));
  sky.rotation.set(.4,1.2,.3);scene.add(sky);
  const sp=new Float32Array(3*2600),sc=new Float32Array(3*2600);
  for(let i=0;i<2600;i++){const u=rnd()*2-1,a=rnd()*TAU,r=Math.sqrt(1-u*u);sp.set([Math.cos(a)*r*1200,u*1200,Math.sin(a)*r*1200],i*3);
    const k=.5+rnd()*.9,b=rnd();sc.set(b<.15?[k,k*.9,k*.75]:b<.35?[k*.75,k*.9,k]:[k,k,k],i*3)}
  const sg=new THREE.BufferGeometry();sg.setAttribute('position',new THREE.BufferAttribute(sp,3));sg.setAttribute('color',new THREE.BufferAttribute(sc,3));
  scene.add(new THREE.Points(sg,new THREE.PointsMaterial({size:1.6,sizeAttenuation:false,vertexColors:true})));

  /* lights */
  const sun=new THREE.DirectionalLight(0xfff3e0,3.4);sun.position.copy(sunDir).multiplyScalar(200);scene.add(sun);
  const earthshine=new THREE.DirectionalLight(0x73deff,.45);earthshine.position.set(6,-40,18);scene.add(earthshine);
  scene.add(new THREE.AmbientLight(0x10203c,.5));
  const fill=new THREE.DirectionalLight(0xdfe8ff,.55);fill.position.set(6,4,40);scene.add(fill);
  const sunPos=new THREE.Vector3(-62,74,-200);                  // flare placed in frame for the cinematic glow
  const glow=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex([[0,'rgba(255,255,255,1)'],[.08,'rgba(255,248,230,1)'],[.22,'rgba(255,214,150,.45)'],[.5,'rgba(115,222,255,.08)'],[1,'rgba(0,0,0,0)']]),blending:THREE.AdditiveBlending,depthWrite:false,color:new THREE.Color(2,2,2)}));
  glow.position.copy(sunPos);glow.scale.setScalar(70);scene.add(glow);

  /* Earth: day/night shader + clouds + atmosphere */
  const earth=new THREE.Group();earth.position.set(5,-50,-36);earth.rotation.set(.32,0,.38);scene.add(earth);
  const R=40;
  const eMat=new THREE.ShaderMaterial({uniforms:{day:{value:day},night:{value:night},sunDir:{value:sunDir}},
    vertexShader:`varying vec2 vUv;varying vec3 vN;varying vec3 vW;
      void main(){vUv=uv;vN=normalize(mat3(modelMatrix)*normal);vec4 w=modelMatrix*vec4(position,1.);vW=w.xyz;gl_Position=projectionMatrix*viewMatrix*w;}`,
    fragmentShader:`uniform sampler2D day,night;uniform vec3 sunDir;varying vec2 vUv;varying vec3 vN;varying vec3 vW;
      void main(){vec3 n=normalize(vN),V=normalize(cameraPosition-vW);float l=dot(n,sunDir);
        vec3 d=texture2D(day,vUv).rgb,ni=texture2D(night,vUv).rgb;
        float dayF=smoothstep(-.1,.2,l);
        vec3 col=d*max(l,0.)*1.75;
        col+=ni*vec3(1.,.78,.5)*2.4*(1.-dayF);
        float ocean=smoothstep(.0,.08,d.b-d.r)*(1.-smoothstep(.2,.4,dot(d,vec3(.333))));
        vec3 h=normalize(sunDir+V);col+=vec3(1.,.93,.8)*pow(max(dot(n,h),0.),70.)*ocean*1.6*dayF;
        float fr=pow(1.-max(dot(n,V),0.),2.6);col+=vec3(.42,.84,1.)*fr*(.04+.65*clamp(l+.3,0.,1.));
        gl_FragColor=vec4(col,1.);
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
      }`});
  const ball=new THREE.Mesh(new THREE.SphereGeometry(R,160,120),eMat);earth.add(ball);
  const cl=new THREE.Mesh(new THREE.SphereGeometry(R*1.012,160,120),new THREE.MeshStandardMaterial({color:0xffffff,alphaMap:clouds,transparent:true,depthWrite:false,roughness:1,metalness:0}));
  earth.add(cl);
  const atm=new THREE.Mesh(new THREE.SphereGeometry(R*1.035,128,96),new THREE.ShaderMaterial({uniforms:{sunDir:{value:sunDir}},
    vertexShader:`varying vec3 vN;varying vec3 vW;void main(){vN=normalize(mat3(modelMatrix)*normal);vec4 w=modelMatrix*vec4(position,1.);vW=w.xyz;gl_Position=projectionMatrix*viewMatrix*w;}`,
    fragmentShader:`uniform vec3 sunDir;varying vec3 vN;varying vec3 vW;
      void main(){vec3 n=normalize(vN),V=normalize(cameraPosition-vW);float rim=pow(clamp(1.-abs(dot(n,V)),0.,1.),7.);
        float lit=clamp(dot(n,sunDir)+.35,0.,1.);gl_FragColor=vec4(vec3(.42,.84,1.)*rim*lit*1.5,1.);
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
      }`,side:THREE.BackSide,blending:THREE.AdditiveBlending,transparent:true,depthWrite:false}));
  earth.add(atm);
  objs.earth={ball,cl};

  /* distant worlds */
  const planet=(t,r,pos)=>{const m=new THREE.Mesh(new THREE.SphereGeometry(r,64,48),new THREE.MeshStandardMaterial({map:t,roughness:1,metalness:0}));m.position.set(...pos);scene.add(m);return m};
  objs.moon=planet(moonT,3.2,[-17,10,-120]);objs.mars=planet(marsT,2.6,[-32,-8,-190]);
  const saturn=new THREE.Group();saturn.position.set(30,38,-210);scene.add(saturn);
  saturn.add(new THREE.Mesh(new THREE.SphereGeometry(13,64,48),new THREE.MeshStandardMaterial({map:satT,roughness:1})));
  const rg=new THREE.RingGeometry(16.3,30,160,1),uv=rg.attributes.uv,pos=rg.attributes.position;
  for(let i=0;i<pos.count;i++){const r=Math.hypot(pos.getX(i),pos.getY(i));uv.setXY(i,(r-16.3)/13.7,.5)}
  const ring=new THREE.Mesh(rg,new THREE.MeshBasicMaterial({map:ringT,transparent:true,side:THREE.DoubleSide,depthWrite:false,color:0xc9c0ae}));
  ring.rotation.x=-Math.PI/2+.42;saturn.add(ring);saturn.rotation.set(.15,0,.32);objs.saturn=saturn;

  /* Saturn V (NASA) */
  const rocket=new THREE.Group(),inner=s5.scene;
  const bb=new THREE.Box3().setFromObject(inner),ctr=bb.getCenter(new THREE.Vector3());inner.position.sub(ctr);rocket.add(inner);
  inner.traverse(o=>{if(o.isMesh){o.material.roughness=.55;o.material.metalness=.12;o.material.envMapIntensity=.4}});
  rocket.scale.setScalar(1.15);scene.add(rocket);objs.rocket=rocket;objs.rocketHalf=(bb.max.y-bb.min.y)/2*1.15;

  /* ISS (NASA) – untextured, so give it real-looking metal + gold solar arrays */
  const st=new THREE.Group(),im=iss.scene;
  im.traverse(o=>{if(!o.isMesh)return;const b=new THREE.Box3().setFromObject(o);if(b.min.y>30){o.visible=false;return}
    const solar=/aniso|apollo/i.test(o.material.name);
    o.material=solar?new THREE.MeshStandardMaterial({color:0x6e5632,metalness:.45,roughness:.5,envMapIntensity:.35})
                    :new THREE.MeshStandardMaterial({color:0xd4d8df,metalness:.4,roughness:.5,envMapIntensity:.4})});
  const ib=new THREE.Box3();im.traverse(o=>{if(o.isMesh&&o.visible)ib.expandByObject(o)});im.position.sub(ib.getCenter(new THREE.Vector3()));
  st.add(im);st.scale.setScalar(.3);scene.add(st);objs.iss=st;

  /* gold-foil satellite (built in code) */
  const sat=new THREE.Group();
  const noise=document.createElement('canvas');noise.width=noise.height=256;{const x=noise.getContext('2d');for(let i=0;i<2600;i++){x.fillStyle=`rgba(255,255,255,${rnd()*.5})`;x.fillRect(rnd()*256,rnd()*256,2+rnd()*10,1+rnd()*4)}}
  const bump=new THREE.CanvasTexture(noise);
  const foil=new THREE.MeshStandardMaterial({color:0xc8952e,metalness:.85,roughness:.42,bumpMap:bump,bumpScale:.6,envMapIntensity:.5});
  sat.add(new THREE.Mesh(new THREE.CylinderGeometry(.9,.9,3.2,32),foil));
  const cap=new THREE.Mesh(new THREE.CylinderGeometry(.92,.92,.3,32),new THREE.MeshStandardMaterial({color:0xcfd5dd,metalness:.8,roughness:.3}));cap.position.y=1.7;sat.add(cap);
  const cells=document.createElement('canvas');cells.width=512;cells.height=192;{const x=cells.getContext('2d');x.fillStyle='#0b1f45';x.fillRect(0,0,512,192);
    for(let i=0;i<16;i++)for(let j=0;j<6;j++){x.fillStyle=`hsl(${210+rnd()*12},70%,${22+rnd()*8}%)`;x.fillRect(i*32+2,j*32+2,28,28)}}
  const ct=new THREE.CanvasTexture(cells);ct.colorSpace=THREE.SRGBColorSpace;
  const panelM=new THREE.MeshStandardMaterial({map:ct,metalness:.5,roughness:.25,envMapIntensity:1});
  for(const s of[-1,1]){const p=new THREE.Mesh(new THREE.BoxGeometry(5,.05,1.9),panelM);p.position.x=s*3.6;sat.add(p);
    const arm=new THREE.Mesh(new THREE.CylinderGeometry(.05,.05,1.2,8),cap.material);arm.rotation.z=Math.PI/2;arm.position.x=s*1.2;sat.add(arm)}
  const dish=new THREE.Mesh(new THREE.SphereGeometry(1,32,16,0,TAU,0,.9),new THREE.MeshStandardMaterial({color:0xf2f4f7,metalness:.2,roughness:.4,side:THREE.DoubleSide}));
  dish.position.y=-2.2;dish.rotation.x=Math.PI;sat.add(dish);
  scene.add(sat);objs.sat=sat;

  /* Propel spacemen – stylised accent */
  const man=(t,s)=>{const m=new THREE.Mesh(new THREE.PlaneGeometry(s,s),new THREE.MeshBasicMaterial({map:t,transparent:true,depthWrite:false,color:0xe6ecf5}));scene.add(m);return m};
  objs.man1=man(keyed(sm1),7.5);objs.man2=man(keyed(sm3),6);

  /* engine plume: flame (additive) + exhaust (soft) */
  const plume=(n,additive)=>{const g=new THREE.BufferGeometry();
    g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(n*3),3));g.setAttribute('aCol',new THREE.BufferAttribute(new Float32Array(n*4),4));g.setAttribute('aSize',new THREE.BufferAttribute(new Float32Array(n),1));
    const m=new THREE.ShaderMaterial({vertexShader:`attribute vec4 aCol;attribute float aSize;varying vec4 vC;
      void main(){vC=aCol;vec4 mv=modelViewMatrix*vec4(position,1.);gl_PointSize=aSize*(1855./-mv.z);gl_Position=projectionMatrix*mv;}`,
      fragmentShader:`varying vec4 vC;void main(){float r=length(gl_PointCoord-.5);float a=smoothstep(.5,0.,r);a*=a;if(vC.a*a<.004)discard;gl_FragColor=vec4(vC.rgb,vC.a*a);
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
      }`,transparent:true,depthWrite:false,blending:additive?THREE.AdditiveBlending:THREE.NormalBlending});
    const p=new THREE.Points(g,m);p.frustumCulled=false;scene.add(p);
    const seeds=[];for(let i=0;i<n;i++)seeds.push({ph:rnd(),life:additive?.18+rnd()*.3:1.2+rnd()*1.6,sp:additive?10+rnd()*8:4+rnd()*4,dx:rnd()-.5,dy:rnd()-.5,dz:rnd()-.5,s:rnd()});
    return{p,g,seeds,n,additive}};
  objs.flame=plume(1400,true);objs.smoke=plume(700,false);

  /* grade: vignette + fine grain */
  composer.addPass(new RenderPass(scene,camera));
  composer.addPass(new UnrealBloomPass(new THREE.Vector2(W,H),.75,.55,.92));
  grade=new ShaderPass({uniforms:{tDiffuse:{value:null},time:{value:0}},
    vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
    fragmentShader:`uniform sampler2D tDiffuse;uniform float time;varying vec2 vUv;
      float h(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233))+time)*43758.5453);}
      void main(){vec4 c=texture2D(tDiffuse,vUv);vec2 q=vUv-.5;q.x*=.8;float v=smoothstep(.85,.25,length(q));
        c.rgb*=mix(.55,1.,v);c.rgb+=(h(vUv*1000.)-.5)*.018;gl_FragColor=c;}`});
  composer.addPass(grade);composer.addPass(new OutputPass());
}
const composer=new EffectComposer(renderer);composer.setPixelRatio(1);composer.setSize(W,H);let grade;

/* ---------- choreography: everything is a pure function of t, so the loop is seamless ---------- */
const Y=new THREE.Vector3(0,1,0),tmp=new THREE.Vector3(),q=new THREE.Quaternion(),qr=new THREE.Quaternion();
const R0=new THREE.Vector3(9,-30,-2),R1=new THREE.Vector3(-12,36,-6),RW=[.2,8.4];
const rocketAt=(t,out)=>{const u=win(t,...RW);if(u<0)return false;const e=u*u*.45+u*.55;out.lerpVectors(R0,R1,e);return true};
const rDir=R1.clone().sub(R0).normalize();
let mx=0,my=0;
function update(t){
  const o=objs,w=TAU/P;
  camera.position.set(Math.sin(t*w)*1.4+mx*1.5,1.2+Math.cos(t*w)*.7-my*1,32);camera.lookAt(mx*1.2,3,0);
  o.earth.ball.rotation.y=t*w;o.earth.cl.rotation.y=t*w*1+Math.sin(t*w)*.05;
  o.moon.rotation.y=t*w;o.mars.rotation.y=t*w;o.saturn.rotation.y=Math.sin(t*w)*.05;

  /* Saturn V climbing out of the atmosphere */
  const rk=o.rocket;rk.visible=rocketAt(t,rk.position);
  q.setFromUnitVectors(Y,rDir);qr.setFromAxisAngle(Y,t*.35);rk.quaternion.copy(q).multiply(qr);
  for(const pl of[o.flame,o.smoke]){
    const P_=pl.g.attributes.position.array,C=pl.g.attributes.aCol.array,S=pl.g.attributes.aSize.array;
    for(let i=0;i<pl.n;i++){const s=pl.seeds[i],a=((t/s.life+s.ph)%1)*s.life,f=a/s.life,born=t-a;
      if(!rocketAt(born,tmp)){C[i*4+3]=0;continue}
      tmp.addScaledVector(rDir,-o.rocketHalf-.2);
      const spread=pl.additive?.35+a*1.6:.8+a*2.4;
      P_[i*3]=tmp.x-rDir.x*s.sp*a+s.dx*spread;P_[i*3+1]=tmp.y-rDir.y*s.sp*a+s.dy*spread;P_[i*3+2]=tmp.z-rDir.z*s.sp*a+s.dz*spread;
      if(pl.additive){const k=f<.15?[1.5,1.4,1.2]:f<.4?[1.3,.75,.3]:f<.7?[.9,.33,.09]:[.35,.1,.04];
        C.set([k[0],k[1],k[2],(1-f)*(.18+s.s*.22)],i*4);S[i]=(.35+f*1.3)*(.7+s.s*.6)}
      else{const g_=.32+s.s*.18;C.set([g_,g_*1.04,g_*1.12,(f<.1?f*10:1)*(1-f)*(1-f)*.07],i*4);S[i]=(1.2+f*4.5)*(.7+s.s*.6)}
    }
    pl.g.attributes.position.needsUpdate=pl.g.attributes.aCol.needsUpdate=pl.g.attributes.aSize.needsUpdate=true;
  }

  /* ISS gliding over the limb */
  let u=win(t,8.6,21.5);o.iss.visible=u>=0;
  if(u>=0){o.iss.position.set(lerp(17,-17,u),lerp(1,7,u)+Math.sin(u*TAU)*.5,lerp(-6,-10,u));o.iss.rotation.set(.38,.55+u*1.3,.18)}
  /* satellite tumbling across the top */
  u=win(t,13,23.6);o.sat.visible=u>=0;
  if(u>=0){o.sat.position.set(lerp(-16,15,u),lerp(15,9,u)+Math.sin(u*TAU*1.5)*.7,lerp(4,-1,u));o.sat.rotation.set(u*2.4,u*3.4,.4+u*.8)}
  /* Propel spacemen drifting through */
  u=win(t,7.6,16.4);o.man1.visible=u>=0;
  if(u>=0){o.man1.position.set(lerp(-15,15,u),lerp(-4,11,u)+Math.sin(u*TAU)*1,lerp(8,4,u));o.man1.quaternion.copy(camera.quaternion);o.man1.rotateZ(-.4+u*2.6)}
  u=win(t,16.6,23.9);o.man2.visible=u>=0;
  if(u>=0){o.man2.position.set(lerp(15,-15,u),lerp(-6,5,u)+Math.sin(u*TAU)*.8,lerp(8,5,u));o.man2.quaternion.copy(camera.quaternion);o.man2.rotateZ(.3-u*3.2)}
  grade.uniforms.time.value=(t*37.13)%100;
}

/* ---------- run ---------- */
window.renderAt=t=>{update(((t%P)+P)%P);composer.render()};
window.period=()=>P;
addEventListener('keydown',e=>{if(e.key==='h'||e.key==='H')document.body.classList.toggle('clean')});
addEventListener('pointermove',e=>{mx=(e.clientX/innerWidth-.5);my=(e.clientY/innerHeight-.5)});
build().then(()=>{
  window.ready=true;
  if(!location.search.includes('manual')){const t0=performance.now();const loop=()=>{renderAt((performance.now()-t0)/1000);requestAnimationFrame(loop)};loop()}
  else renderAt(0);
}).catch(e=>{console.error(e);window.err=String(e.stack||e)});
</script>
</body>
</html>
