<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zhenzhen Liu – Particle Motion</title>
<style>
  @font-face{font-family:'Bangers';src:url(assets/Bangers-Regular.ttf)}
  html,body{margin:0;height:100%;background:#00091f;overflow:hidden;font-family:system-ui,sans-serif}
  #c{position:absolute;left:50%;top:50%;width:1080px;height:1350px;transform-origin:center;cursor:crosshair}
  #hint{position:fixed;left:16px;bottom:12px;font:500 13px system-ui;color:#778191;transition:opacity .3s;z-index:2}
  body.clean #hint{opacity:0}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1350"></canvas>
<div id="hint">move the mouse to push the particles · click = restart · H = hide this hint (for recording)</div>
<script>
/* ================= EDIT YOUR COPY HERE ================= */
const COPY = {
  topLeft:"AI ENABLEMENT", topRight:"MELBOURNE · 2026",
  marquee:"ZHENZHEN LIU ✦ AI ENABLEMENT ✦ PROPEL VENTURES ✦ PROMPT ✦ BUILD ✦ SHIP ✦ TEACH ✦ ",
  name:["ZHEN","ZHEN","LIU"], role:["AI","ENABLER"],
  words:["PROMPT","BUILD","SHIP","TEACH"],
  closer:["LET'S","BUILD."], signoff:{main:"ZHENZHEN LIU", sub:"PROPEL VENTURES"}
};
/* ======================================================== */

const W=1080,H=1350,CX=W/2,CY=H/2,F=900,N=18000;
const NAVY='#00164c', HERO='#73deff', ICE='#c0f3ff', BLUE='#0057a5', WHITE='#ffffff';
const cv=document.getElementById('c'), g=cv.getContext('2d');
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);cv.style.transform=`translate(-50%,-50%) scale(${s})`}
addEventListener('resize',fit);fit();

/* seeded RNG so every run (and every recorded frame) is identical */
let seed=20260101;
function rnd(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=rnd()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};

/* ---------- target builders ---------- */
const off=document.createElement('canvas');off.width=W;off.height=H;const ox=off.getContext('2d',{willReadFrequently:true});
function textPts(parts){            // parts: [{lines,size,y,lh,step}]
  const out=[];
  for(const p of parts){
    ox.clearRect(0,0,W,H);ox.fillStyle='#fff';ox.textAlign='center';ox.textBaseline='middle';
    let fs=p.size||460;ox.font=`${fs}px Bangers`;
    const mw=Math.max(...p.lines.map(l=>ox.measureText(l).width));
    fs*=Math.min(1,(W-150)/mw,(p.maxH||960)/(p.lines.length*fs*(p.lh||.86)));ox.font=`${fs}px Bangers`;
    const lh=fs*(p.lh||.86),y0=(p.y??CY)-(p.lines.length-1)*lh/2;
    p.lines.forEach((l,i)=>ox.fillText(l,CX,y0+i*lh));
    const d=ox.getImageData(0,0,W,H).data,st=p.step||4;
    for(let y=0;y<H;y+=st)for(let x=0;x<W;x+=st)
      if(d[(y*W+x)*4+3]>128)out.push([x-CX+(rnd()-.5)*st,y-CY+(rnd()-.5)*st,(rnd()-.5)*60]);
  }
  return shuffle(out).slice(0,14000);
}
const IMGCOL=[WHITE,HERO,ICE,BLUE,'#778191','#e20329'];
const IMGRGB=IMGCOL.map(c=>[1,3,5].map(i=>parseInt(c.slice(i,i+2),16)));
const loadImg=src=>new Promise(r=>{const im=new Image();im.onload=()=>r(im);im.src=src});
function imagePts(im,scale,dy){            // pixel-sample an illustration into coloured particle targets
  const c=document.createElement('canvas');c.width=im.width;c.height=im.height;const x=c.getContext('2d',{willReadFrequently:true});
  x.drawImage(im,0,0);const d=x.getImageData(0,0,c.width,c.height).data,bg=[d[16],d[17],d[18]],out=[];
  for(let y=0;y<c.height;y+=2)for(let xx=0;xx<c.width;xx+=2){
    const o=(y*c.width+xx)*4,r=d[o],g2=d[o+1],b=d[o+2];
    if(d[o+3]<128||Math.abs(r-bg[0])+Math.abs(g2-bg[1])+Math.abs(b-bg[2])<60||r+g2+b<150)continue;   // skip background + dark linework
    let best=0,bd=1e9;IMGRGB.forEach((q,k)=>{const e=(q[0]-r)**2+(q[1]-g2)**2+(q[2]-b)**2;if(e<bd){bd=e;best=k}});
    out.push([(xx-c.width/2)*scale,(y-c.height/2)*scale+dy,(rnd()-.5)*40,best]);
  }
  return shuffle(out).slice(0,13000);
}
function vortex(){const o=[];for(let i=0;i<11000;i++){const arm=i%3,r=Math.sqrt(rnd())*520,a=r*.011+arm*2.094+(rnd()-.5)*.5;
  o.push([Math.cos(a)*r,(rnd()-.5)*50+Math.sin(a)*r*.38,Math.sin(a)*r])}return o}
function sphere(){const o=[],n=9000;for(let i=0;i<n;i++){const y=1-2*(i+.5)/n,r=Math.sqrt(1-y*y),a=i*2.39996;
  o.push([Math.cos(a)*r*400,y*400,Math.sin(a)*r*400])}return o}
function sheet(){const o=[];for(let i=0;i<11000;i++)o.push([(rnd()-.5)*1000,0,(rnd()-.5)*700]);return o}

/* ---------- timeline (seconds) ---------- */
const phases=[];let PH=[];
async function build(){
  const C=COPY;
  const [a1,a3]=await Promise.all([loadImg('assets/spaceman-01.png'),loadImg('assets/spaceman-03.png')]);
  PH=[
    {pts:vortex(),    d:1.9,dm:.5, rot:.55},
    {pts:textPts([{lines:C.name,size:520,lh:.84,y:CY-40}]),                          d:3.3,dm:.45},
    {pts:imagePts(a1,1.9,-70),d:3.0,dm:.45,img:1},
    {pts:textPts([{lines:C.role,size:520,lh:.86,y:CY-40}]),                          d:2.6,dm:.4},
    ...C.words.map(w=>({pts:textPts([{lines:[w],size:520}]),                  d:1.3,dm:.22})),
    {pts:sheet(),     d:1.4,dm:.35, wave:1},
    {pts:textPts([{lines:C.closer,size:520,lh:.84,y:CY-40}]),                        d:3.2,dm:.45},
    {pts:imagePts(a3,1.9,-70),d:2.8,dm:.45,img:1},
    {pts:textPts([{lines:['ZHENZHEN','LIU'],size:420,lh:.84,y:CY-130,maxH:560},{lines:[C.signoff.sub],size:110,y:CY+300,step:3}]), d:3.2,dm:.45}
  ];
  let t=0;PH.forEach(p=>{p.t0=t;t+=p.d});PH.total=t;
}

/* ---------- particles ---------- */
const px=new Float32Array(N),py=new Float32Array(N),pz=new Float32Array(N);
const vx=new Float32Array(N),vy=new Float32Array(N),vz=new Float32Array(N);
const tx=new Float32Array(N),ty=new Float32Array(N),tz=new Float32Array(N);
const hx=new Float32Array(N),hy=new Float32Array(N),hz=new Float32Array(N);
const kk=new Float32Array(N),dl=new Float32Array(N),sz=new Float32Array(N),has=new Uint8Array(N);
const perm=new Uint32Array(N),ibin=new Uint8Array(N).fill(255);
function init(){
  const p=shuffle([...Array(N).keys()]);p.forEach((v,i)=>perm[i]=v);
  for(let i=0;i<N;i++){
    const gs=()=>Math.sqrt(-2*Math.log(rnd()+1e-9))*Math.cos(6.283*rnd());   // gaussian: soft halo, sparse edges
    hx[i]=gs()*340;hy[i]=gs()*400;hz[i]=gs()*300;
    px[i]=hx[i];py[i]=hy[i];pz[i]=hz[i];kk[i]=.022+rnd()*.04;sz[i]=1.8+rnd()*1.8;
  }
}
const BUCKETS=[[0,.7,HERO],[.7,.82,WHITE],[.82,.92,ICE],[.92,1,BLUE]];

let phase=-1,T=0,mx=-9999,my=-9999,sway=0;
function setPhase(k){
  phase=k;const ph=PH[k],pts=ph.pts;
  for(let i=0;i<N;i++){
    const j=perm[i];
    if(j<pts.length){has[i]=1;tx[i]=pts[j][0];ty[i]=pts[j][1];tz[i]=pts[j][2];ibin[i]=pts[j][3]??255}else{has[i]=0;ibin[i]=255}
    dl[i]=rnd()*ph.dm;
  }
}
function step(){
  const dt=1/60;T+=dt;
  if(T>=PH.total)T-=PH.total;
  let k=PH.length-1;while(PH[k].t0>T)k--;
  if(k!==phase)setPhase(k);
  const ph=PH[phase],ang=ph.rot?T*ph.rot:0,ca=Math.cos(ang),sa=Math.sin(ang),tilt=.32,ct=Math.cos(tilt),st=Math.sin(tilt);
  const beat=1+.03*Math.pow(Math.max(0,Math.sin(T*6.9)),3),hang=T*.12,hc=Math.cos(hang),hs=Math.sin(hang);
  sway=Math.sin(T*.5)*.16;
  for(let i=0;i<N;i++){
    let X=px[i],Y=py[i],Z=pz[i];
    if(dl[i]>0){                                   // swirl phase between shapes
      dl[i]-=dt;const r=Math.hypot(X,Y)+40;
      vx[i]+=-Y/r*.9;vy[i]+=X/r*.9;vx[i]*=.985;vy[i]*=.985;vz[i]*=.97;
    }else{
      let a,b,c,kf=kk[i],damp=.9;
      if(has[i]){
        a=tx[i];b=ty[i];c=tz[i];
        if(ph.rot){const x2=a*ca+c*sa,z2=-a*sa+c*ca;a=x2;b=b*ct-z2*st;c=b*0+ (ty[i]*st+z2*ct)}
        if(ph.img){b+=Math.sin(T*1.7)*16;a+=Math.sin(T*1.1)*10}
        else if(!ph.rot&&!ph.wave){a*=beat;b*=beat}
        if(ph.wave){b=44*Math.sin(a*.013+T*2.4)+30*Math.cos(c*.017+T*1.5);}
      }else{a=hx[i]*hc+hz[i]*hs;b=hy[i];c=-hx[i]*hs+hz[i]*hc;kf=.004;damp=.955}
      vx[i]+=(a-X)*kf;vy[i]+=(b-Y)*kf;vz[i]+=(c-Z)*kf;
      vx[i]*=damp;vy[i]*=damp;vz[i]*=damp;
      if(has[i]&&!ph.rot&&!ph.wave&&!ph.img){vx[i]+=(rnd()-.5)*.09;vy[i]+=(rnd()-.5)*.09} // shimmer
    }
    // mouse push
    const sc=F/(F+Z),sx=CX+X*sc,sy=CY+Y*sc,dx=sx-mx,dy=sy-my,d2=dx*dx+dy*dy;
    if(d2<22500){const d=Math.sqrt(d2)+1,f=(1-d/150),f2=f*f*9;vx[i]+=dx/d*f2;vy[i]+=dy/d*f2;vz[i]+=(rnd()-.5)*f2}
    px[i]=X+vx[i];py[i]=Y+vy[i];pz[i]=Z+vz[i];
  }
}

/* ---------- drawing ---------- */
function draw(){
  g.globalCompositeOperation='source-over';
  g.fillStyle='rgba(0,22,76,.24)';g.fillRect(0,0,W,H);
  g.globalCompositeOperation='lighter';
  const cs=Math.cos(sway),sn=Math.sin(sway);
  const dot=i=>{
    const X=px[i]*cs+pz[i]*sn,Z=-px[i]*sn+pz[i]*cs;
    const sc=F/(F+Z);if(sc<=0||sc>3)return;
    const dim=has[i]?1:.6,tw=(i%53===0&&Math.sin(T*6+i)>.85)?3:1,s=sz[i]*sc*tw*dim*(1+Math.min(Math.hypot(vx[i],vy[i])*.12,2));
    g.fillRect(CX+X*sc-s/2,CY+py[i]*sc-s/2,s,s);
  };
  for(const [a,b,col] of BUCKETS){
    g.fillStyle=col;g.globalAlpha=col===BLUE?.8:.9;
    for(let i=(a*N)|0,e=(b*N)|0;i<e;i++)if(ibin[i]===255)dot(i);
  }
  g.globalAlpha=.95;
  for(let c=0;c<IMGCOL.length;c++){g.fillStyle=IMGCOL[c];for(let i=0;i<N;i++)if(ibin[i]===c)dot(i)}
  g.globalAlpha=1;g.globalCompositeOperation='source-over';hud();
}
function hud(){
  g.textBaseline='alphabetic';
  g.fillStyle=WHITE;g.font='700 24px system-ui,sans-serif';g.letterSpacing='5px';
  g.textAlign='left';g.fillText(COPY.topLeft,64,80);
  g.textAlign='right';g.fillText(COPY.topRight,W-64+5,80);g.letterSpacing='0px';
  // marquee band (Lando-style ticker)
  g.fillStyle='rgba(0,22,76,.94)';g.fillRect(0,1196,W,104);
  g.fillStyle=HERO;g.fillRect(0,1196,W,4);
  g.font='96px Bangers';g.textAlign='left';
  const m=g.measureText(COPY.marquee).width,off=(T*170)%m;
  g.fillStyle=WHITE;
  for(let x=-off;x<W;x+=m)g.fillText(COPY.marquee,x,1280);
  // progress
  const p=T/PH.total;g.fillStyle='rgba(255,255,255,.22)';g.fillRect(64,1322,W-128,5);
  g.fillStyle=HERO;g.fillRect(64,1322,(W-128)*p,5);
}

/* ---------- run ---------- */
window.advance=n=>{for(let i=0;i<n;i++)step()};
window.render=draw;
window.total=()=>PH.total;
window.restart=()=>{seed=20260101;T=0;phase=-1;init();setPhase(0)};
let acc=0,last=0;
function loop(ts){acc+=Math.min(ts-last,100);last=ts;while(acc>=1000/60){step();acc-=1000/60}draw();requestAnimationFrame(loop)}
function pointer(e){const r=cv.getBoundingClientRect();mx=(e.clientX-r.left)*W/r.width;my=(e.clientY-r.top)*H/r.height}
addEventListener('pointermove',pointer);addEventListener('pointerleave',()=>{mx=my=-9999});
cv.addEventListener('click',()=>restart());
addEventListener('keydown',e=>{if(e.key==='h'||e.key==='H')document.body.classList.toggle('clean')});
document.fonts.load('100px Bangers').then(async()=>{
  await build();init();setPhase(0);
  if(!location.search.includes('manual')){requestAnimationFrame(ts=>{last=ts;loop(ts)})}
  window.ready=true;
});
</script>
</body>
</html>
